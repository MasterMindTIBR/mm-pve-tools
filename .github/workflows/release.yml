name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

env:
  DEBIAN_IMAGE: docker://debian:13@sha256:4c25275446ca371766b8b093c696782eabce06263fccacb8d5d813b3dc44b308

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: versão da tag
        run: scripts/check-release-version.sh "$GITHUB_REF_NAME"
      - name: ambiente production
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release-preflight.sh

  build:
    name: Build + pre-release (canal testing)
    needs: preflight
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    container:
      image: debian:13@sha256:4c25275446ca371766b8b093c696782eabce06263fccacb8d5d813b3dc44b308
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: dependências de build
        uses: ./.github/actions/debian-build-deps
      - name: versão do changelog
        id: ver
        shell: bash
        run: |
          version=$(dpkg-parsechangelog -l debian/changelog -SVersion)
          version=${version#*:}
          version=${version%-*}
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: build e lintian
        run: scripts/build-deb.sh --in-container --lintian
      - name: checksums
        shell: bash
        run: (cd dist && sha256sum -- *.deb > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-debs
          path: dist/
      - name: pre-release
        uses: softprops/action-gh-release@6cbd405e2c4e67a21c47fa9e383d020e4e28b836 # v2.3.3
        with:
          prerelease: true
          make_latest: false
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true

  dispatch-apt:
    name: Avisa o repositório APT (MasterMindTIBR/apt)
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: verifica credenciais do GitHub App
        id: creds
        shell: bash
        env:
          APP_ID: ${{ vars.APT_BOT_APP_ID }}
          PRIVATE_KEY: ${{ secrets.APT_BOT_PRIVATE_KEY }}
        run: |
          if [[ -n "$APP_ID" && -n "$PRIVATE_KEY" ]]; then
            echo enabled=true >> "$GITHUB_OUTPUT"
          else
            echo enabled=false >> "$GITHUB_OUTPUT"
            echo 'credenciais do App ausentes; o APT recolherá a release na execução horária'
          fi
      - name: token do GitHub App mastermind-apt-bot
        id: app
        if: steps.creds.outputs.enabled == 'true'
        uses: actions/create-github-app-token@67018539274d69449ef7c02e8e71183d1719ab42 # v2.1.4
        with:
          app-id: ${{ vars.APT_BOT_APP_ID }}
          private-key: ${{ secrets.APT_BOT_PRIVATE_KEY }}
          owner: MasterMindTIBR
          repositories: apt
      - name: repository_dispatch
        if: steps.creds.outputs.enabled == 'true'
        env:
          APP_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -eu
          python3 - <<'PY' > payload.json
          import json
          import os

          print(json.dumps({
              "event_type": "release-published",
              "client_payload": {
                  "repo": "mm-pve-tools",
                  "version": os.environ["VERSION"],
              },
          }))
          PY
          curl -fsS -X POST \
            -H "Authorization: Bearer $APP_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/MasterMindTIBR/apt/dispatches \
            --data-binary @payload.json
