name: ci

on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    - cron: '23 4 * * 1' # semanal: âncoras + compat ntfs3g

permissions:
  contents: read

env:
  DEBIAN_IMAGE: docker://debian:13@sha256:4c25275446ca371766b8b093c696782eabce06263fccacb8d5d813b3dc44b308

jobs:
  perl:
    name: Perl (syntax + perlcritic + tests)
    runs-on: ubuntu-24.04
    container:
      image: debian:13@sha256:4c25275446ca371766b8b093c696782eabce06263fccacb8d5d813b3dc44b308
    steps:
      - name: checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: deps
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            perl make nodejs libperl-critic-perl
      - name: perl -c em tudo (com stubs PVE p/ endpoints)
        shell: bash
        run: |
          rc=0
          while IFS= read -r f; do
            perl -Ilib -Iperl -It/lib-stubs -c "$f" || rc=1
          done < <(find bin lib perl -type f ! -name '*.py' ! -name '*.pod' ! -path '*/t/*' | sort)
          exit $rc
      - name: lint Perl
        run: make lint
      - name: testes (prove)
        run: make test

  gateway:
    name: Gateway (unittest python)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: make test-gateway

  api-real-pve:
    name: API (módulos Perl reais do PVE 9.2)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: testes contra PVE real
        run: make test-api

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: shellcheck nos maintainer scripts e scripts shell
        run: |
          find debian -type f \( -name '*.postinst' -o -name '*.prerm' -o -name '*.postrm' \) -print0 \
            | xargs -0 -r shellcheck --shell=sh
          find lib gateway -type f -name '*.sh' -print0 \
            | xargs -0 -r shellcheck --shell=sh
          find t/gui -type f -name '*.sh' -print0 \
            | xargs -0 -r shellcheck --shell=sh
          find scripts -type f -name '*.sh' -print0 \
            | xargs -0 -r shellcheck --shell=bash

  eslint:
    name: JS lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: eslint (js/src concatenável)
        run: |
          make js
          npx --yes eslint@8.57.1 -c .eslintrc.json js/src build/mm-tools.js

  gui:
    name: GUI PVE 9.2 (Playwright)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: extrai assets dos debs PVE fixados
        shell: bash
        run: |
          set -euo pipefail
          MIRROR=http://download.proxmox.com/debian/pve
          KEY_URL=https://enterprise.proxmox.com/debian/proxmox-archive-keyring-trixie.gpg
          KEY_SHA=136673be77aba35dcce385b28737689ad64fd785a797e57897589aed08db6e45
          root="$RUNNER_TEMP/pve-gui-assets"
          mkdir -p "$root/keyring" "$root/debs" "$root/x"
          curl -fsSL "$KEY_URL" -o "$root/keyring/archive.gpg"
          echo "$KEY_SHA  $root/keyring/archive.gpg" | sha256sum -c -
          gpg --dearmor < "$root/keyring/archive.gpg" > "$root/keyring/archive.gpg.bin"
          curl -fsSL "$MIRROR/dists/trixie/pve-no-subscription/InRelease" -o "$root/InRelease"
          gpgv --keyring "$root/keyring/archive.gpg.bin" "$root/InRelease"
          curl -fsSL "$MIRROR/dists/trixie/pve-no-subscription/binary-amd64/Packages" -o "$root/Packages"
          python3 - "$root/Packages" "$root/debs" > "$root/packages.tsv" <<'PY'
          import pathlib
          import re
          import sys

          source = pathlib.Path(sys.argv[1]).read_text()
          out = pathlib.Path(sys.argv[2])
          pinned = pathlib.Path('ci/pve-manager.version').read_text().strip()
          expected = {
              'pve-manager': pinned,
              'proxmox-widget-toolkit': '5.2.10',
              'libjs-extjs': '7.0.0-9',
              'libjs-qrcodejs': '1.20230525-pve1',
          }
          wanted = {name: None for name in expected}
          for stanza in re.split(r'\n\s*\n', source):
              fields = dict(line.split(': ', 1) for line in stanza.splitlines()
                            if ': ' in line and not line.startswith((' ', '\t')))
              package = fields.get('Package')
              if package not in expected or 'Filename' not in fields:
                  continue
              if fields.get('Version') != expected[package] or wanted[package] is not None:
                  continue
              wanted[package] = fields
          missing = [name for name, item in wanted.items() if item is None]
          if missing:
              raise SystemExit('pacote(s) ausente(s): ' + ', '.join(missing))
          for name, item in wanted.items():
              print(f"{name}\t{item['Version']}\t{item['Filename']}")
              (out / f'{name}.meta').write_text(item['Filename'])
          PY
          while IFS=$'\t' read -r package version filename; do
            curl -fsSL -o "$root/debs/$package.deb" "$MIRROR/$filename"
            dpkg-deb -x "$root/debs/$package.deb" "$root/x/$package"
          done < "$root/packages.tsv"
          mkdir -p "$root/assets"
          find "$root/x/pve-manager" -name index.html.tpl -exec cp {} "$root/assets/" \;
          find "$root/x/pve-manager" -name Nodes.pm -exec cp {} "$root/assets/" \;
          find "$root/x/pve-manager" -name pvemanagerlib.js -exec cp {} "$root/assets/" \;
          find "$root/x/pve-manager" -name u2f-api.js -exec cp {} "$root/assets/" \;
          find "$root/x/pve-manager" -name ext6-pve.css -exec cp {} "$root/assets/" \;
          find "$root/x/proxmox-widget-toolkit" -name proxmoxlib.js -exec cp {} "$root/assets/" \;
          find "$root/x/proxmox-widget-toolkit" -name ext6-pmx.css -exec cp {} "$root/assets/" \;
          find "$root/x/libjs-extjs" -name ext-all.js -exec cp {} "$root/assets/" \;
          find "$root/x/libjs-extjs" -name charts.js -exec cp {} "$root/assets/" \;
          find "$root/x/libjs-extjs" -name locale-en.js -exec cp {} "$root/assets/" \;
          find "$root/x/libjs-qrcodejs" -name qrcode.min.js -exec cp {} "$root/assets/" \;
          test -f "$root/assets/index.html.tpl"
          test -f "$root/assets/Nodes.pm"
          test -f "$root/assets/pvemanagerlib.js"
          test -f "$root/assets/u2f-api.js"
          test -f "$root/assets/ext6-pve.css"
          test -f "$root/assets/proxmoxlib.js"
          test -f "$root/assets/ext6-pmx.css"
          test -f "$root/assets/ext-all.js"
          test -f "$root/assets/charts.js"
          test -f "$root/assets/locale-en.js"
          test -f "$root/assets/qrcode.min.js"
      - name: harness GUI em container Playwright fixado
        run: t/gui/run.sh --assets "$RUNNER_TEMP/pve-gui-assets/assets"

  build:
    name: Build .deb + lintian
    runs-on: ubuntu-24.04
    container:
      image: debian:13@sha256:4c25275446ca371766b8b093c696782eabce06263fccacb8d5d813b3dc44b308
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: dependências de build
        uses: ./.github/actions/debian-build-deps
      - name: build
        run: scripts/build-deb.sh --in-container --lintian
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: debs
          path: dist/

  anchors:
    name: Âncoras de patch (pve-manager 9.2.24 fixado)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: baixa o pve-manager fixado e o widget-toolkit atual
        run: |
          set -euo pipefail
          MIRROR=https://download.proxmox.com/debian/pve
          BASE="$MIRROR/dists/trixie/pve-no-subscription/binary-amd64"
          curl -fsSL "$BASE/Packages" -o Packages
          python3 - <<'PY' > packages.tsv
          import re
          import subprocess

          source = open("Packages", encoding="utf-8").read()
          pinned = open("ci/pve-manager.version", encoding="utf-8").read().strip()
          wanted = ("pve-manager", "proxmox-widget-toolkit")
          latest = {}
          for stanza in re.split(r"\n\s*\n", source):
              fields = dict(
                  line.split(": ", 1)
                  for line in stanza.splitlines()
                  if ": " in line and not line.startswith((" ", "\t"))
              )
              package = fields.get("Package")
              if package not in wanted or "Version" not in fields or "Filename" not in fields:
                  continue
              if package == "pve-manager" and fields["Version"] != pinned:
                  continue
              current = latest.get(package)
              if current is None or subprocess.run(
                  ["dpkg", "--compare-versions", fields["Version"], "gt", current["Version"]],
                  check=False,
              ).returncode == 0:
                  latest[package] = fields
          missing = [package for package in wanted if package not in latest]
          if missing:
              raise SystemExit("pacote(s) ausente(s): " + ", ".join(missing))
          for package in wanted:
              item = latest[package]
              print(f"{package}\t{item['Version']}\t{item['Filename']}")
          PY
          while IFS=$'\t' read -r package version filename; do
            echo "$package $version"
            curl -fsSL -o "$package.deb" "$MIRROR/$filename"
            case "$package" in
              pve-manager) dpkg-deb -x "$package.deb" /tmp/root ;;
              proxmox-widget-toolkit) dpkg-deb -x "$package.deb" /tmp/widget ;;
            esac
          done < packages.tsv
          make -s js >/dev/null
          perl -Ilib -Iperl lib/mm-pve-tools/apply-patches --no-restart --root /tmp/root
          perl -I/tmp/root/usr/share/perl5 -Ilib -Iperl -It/lib-stubs -c \
            /tmp/root/usr/share/perl5/PVE/API2/Nodes.pm
          grep -R -q "Ext.define('PMX.image.LogoSVG'" /tmp/widget
          grep -R -q 'proxmox_logo.svg' /tmp/widget

  anchors-latest:
    name: Âncoras contra upstream mais recente (semanal, não bloqueante)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: aplica os patches no upstream mais recente
        id: check
        continue-on-error: true
        run: |
          set -euo pipefail
          MIRROR=https://download.proxmox.com/debian/pve
          BASE="$MIRROR/dists/trixie/pve-no-subscription/binary-amd64"
          curl -fsSL "$BASE/Packages" -o Packages
          python3 - <<'PY' > packages.tsv
          import re
          import subprocess

          source = open("Packages", encoding="utf-8").read()
          wanted = ("pve-manager", "proxmox-widget-toolkit")
          latest = {}
          for stanza in re.split(r"\n\s*\n", source):
              fields = dict(
                  line.split(": ", 1)
                  for line in stanza.splitlines()
                  if ": " in line and not line.startswith((" ", "\t"))
              )
              package = fields.get("Package")
              if package not in wanted or "Version" not in fields or "Filename" not in fields:
                  continue
              current = latest.get(package)
              if current is None or subprocess.run(
                  ["dpkg", "--compare-versions", fields["Version"], "gt", current["Version"]],
                  check=False,
              ).returncode == 0:
                  latest[package] = fields
          missing = [package for package in wanted if package not in latest]
          if missing:
              raise SystemExit("pacote(s) ausente(s): " + ", ".join(missing))
          for package in wanted:
              item = latest[package]
              print(f"{package}\t{item['Version']}\t{item['Filename']}")
          PY
          rm -rf /tmp/root /tmp/widget
          while IFS=$'\t' read -r package _ filename; do
            curl -fsSL -o "$package.deb" "$MIRROR/$filename"
            case "$package" in
              pve-manager) dpkg-deb -x "$package.deb" /tmp/root ;;
              proxmox-widget-toolkit) dpkg-deb -x "$package.deb" /tmp/widget ;;
            esac
          done < packages.tsv
          make -s js >/dev/null
          perl -Ilib -Iperl lib/mm-pve-tools/apply-patches --no-restart --root /tmp/root
          perl -I/tmp/root/usr/share/perl5 -Ilib -Iperl -It/lib-stubs -c \
            /tmp/root/usr/share/perl5/PVE/API2/Nodes.pm
          grep -R -q "Ext.define('PMX.image.LogoSVG'" /tmp/widget
          grep -R -q 'proxmox_logo.svg' /tmp/widget
      - name: abre ou atualiza o issue único de upstream
        if: steps.check.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'CI: âncoras upstream quebradas';
            const body = [
              'A verificação semanal contra o upstream mais recente falhou.',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Fechar este issue somente depois de atualizar as âncoras e a prova.'
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const issue = existing.data.find(item => item.title === title);
            if (issue) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }

  ntfs3g-compat:
    name: Compatibilidade com releases do ntfs3g (APT MasterMind)
    if: vars.MASTERMIND_APT_READY == 'true'
    runs-on: ubuntu-24.04
    # APT é integração externa do Rock 3. A sonda só executa quando a variável
    # de repositório MASTERMIND_APT_READY estiver explicitamente habilitada.
    container:
      image: debian:13@sha256:4c25275446ca371766b8b093c696782eabce06263fccacb8d5d813b3dc44b308
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: deps
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl
      - name: apt update contra apt.mastermindti.cloud
        run: |
          curl -fsSLo /usr/share/keyrings/mastermind-archive.gpg \
            https://apt.mastermindti.cloud/debian/../mastermind-archive.gpg
          printf 'Types: deb\nURIs: https://apt.mastermindti.cloud/debian\nSuites: trixie\nComponents: stable testing\nSigned-By: /usr/share/keyrings/mastermind-archive.gpg\n' \
            > /etc/apt/sources.list.d/mastermind.sources
          apt-get update -o Acquire::Retries=0
          apt-get install --simulate mm-pve-tools mm-gw-restore
