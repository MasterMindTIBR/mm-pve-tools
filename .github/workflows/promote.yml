name: promote

# Promoção para o canal stable: exige aprovação do Jung (environment
# "production") e só roda depois do teste no lab (plano, D16/Rock "Build").

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão a promover (ex.: 0.1.0), sem "v"'
        required: true
        type: string

permissions:
  contents: read

jobs:
  promote:
    name: Tira o pre-release (stable)
    runs-on: ubuntu-24.04
    environment: production # aprovação obrigatória do Jung
    permissions:
      contents: write
    steps:
      - name: confere que a release existe e é pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          TAG="v$VERSION"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json isPrerelease,assets > rel.json
          python3 - <<'EOF'
          import json, sys
          rel = json.load(open('rel.json'))
          if not rel.get('isPrerelease'):
              print('release não é pre-release; nada a promover'); sys.exit(1)
          names = [a['name'] for a in rel.get('assets', [])]
          if 'SHA256SUMS' not in names:
              print('sem SHA256SUMS'); sys.exit(1)
          if sum(1 for n in names if n.endswith('.deb')) < 2:
              print('faltam .deb'); sys.exit(1)
          EOF
      - name: gh release edit --prerelease=false
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --prerelease=false

  dispatch-apt:
    name: Avisa o repositório APT
    needs: promote
    runs-on: ubuntu-24.04
    steps:
      - name: token do GitHub App mastermind-apt-bot
        id: app
        uses: actions/create-github-app-token@67018539274d69449ef7c02e8e71183d1719ab42 # v2.1.4
        with:
          app-id: ${{ vars.APT_BOT_APP_ID }}
          private-key: ${{ secrets.APT_BOT_PRIVATE_KEY }}
          owner: MasterMindTIBR
          repositories: apt
      - name: repository_dispatch
        env:
          APP_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          python3 - <<'PY' > payload.json
          import json
          import os

          print(json.dumps({
              "event_type": "apt-publish",
              "client_payload": {
                  "repo": "mm-pve-tools",
                  "version": os.environ["VERSION"],
              },
          }))
          PY
          curl -fsS -X POST \
            -H "Authorization: Bearer $APP_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/MasterMindTIBR/apt/dispatches \
            --data-binary @payload.json
