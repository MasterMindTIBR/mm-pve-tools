#!/usr/sbin/nft -f
# Base do gw-restore (pacote mm-gw-restore): política drop seletiva nas
# subinterfaces vl* (VLANs de restore). Cada sessão insere a regra
# "ip saddr <vm> ip daddr <gw_ip> tcp dport 445 accept" na chain vl_policy
# e a remove no revoke. Idempotente no primeiro load; o gw-restore reconcialia.
add table inet gw_restore
add chain inet gw_restore input_vl { type filter hook input priority 0; policy accept; }
add chain inet gw_restore vl_policy
# O smbd escuta em todas as interfaces (não religa sockets em VLAN nova sem
# restart); SMB fica restrito às subinterfaces vl* aqui, nunca na gerência.
add rule inet gw_restore input_vl iifname != "lo" iifname != "vl*" tcp dport { 139, 445 } counter drop
add rule inet gw_restore input_vl iifname "vl*" counter jump vl_policy
add rule inet gw_restore vl_policy ct state established,related counter accept
add rule inet gw_restore vl_policy counter drop
